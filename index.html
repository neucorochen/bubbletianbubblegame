<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aero Jelly Bubbles</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <div class="hud">
    <div class="stat"><span>Очки</span><strong id="scoreEl">0</strong></div>
    <div class="stat"><span>Рекорд</span><strong id="bestEl">0</strong></div>
    <div class="stat"><span>До сдвига</span><strong id="dropEl">6</strong></div>
    <div class="hud-actions">
      <button class="btn-aero btn-music" id="musicBtn" title="Фоновая музыка">🎵 Выкл</button>
      <button class="btn-aero" id="resetBtn">Заново</button>
    </div>
  </div>

  <div class="game-wrap">
    <canvas id="game" width="480" height="660"></canvas>
    <div class="overlay" id="gameOverOverlay">
      <div class="overlay-card">
        <h2>Игра окончена</h2>
        <p id="finalScoreText">Очки: 0</p>
        <button class="btn-aero btn-green" id="playAgainBtn">Играть снова</button>
      </div>
    </div>
  </div>

  <script src="storage.js"></script>
  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
